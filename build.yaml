changelog: "Sonos speakers with Alexa built in (tested on the Sonos Era 100) can now play albums, artists, playlists and songs through the speaker's own queue instead of Alexa's player, which stopped after every track on these devices: set the speaker's IP address in the plugin settings and pick the speaker in the device list. Tracks chain natively, pause/resume/next/previous work by voice, commands addressed to the skill (stop, skip, start over, shuffle, repeat, what's playing, play next, add to queue) drive the speaker, and playback is reported to Jellyfin as it happens. Also fixes the Sonos device-id split that lost the queue after the first track, adds an option to always start albums at track 1 instead of resuming, allows one-word invocation names, and adds more natural French phrasings for queue, repeat, shuffle and what's-playing commands. Known limitation: the Sonos app's queue view shows the queued tracks as blank rows."
